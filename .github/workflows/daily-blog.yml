name: 🤖 Generar artículo de blog diario

on:
  schedule:
    # 03:05 UTC = 00:05 AM Argentina (justo después del reset de cuota de Gemini)
    - cron: '5 3 * * *'
  workflow_dispatch:
    # Ejecución manual para testear

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔄 Pull últimos cambios (evitar conflictos)
        run: |
          git config --local user.email "blogbot@labeltech.com.ar"
          git config --local user.name "LabelTech Blog Bot"
          git pull --rebase origin main

      - name: ✍️ Generar artículo con Gemini 2.5 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/generate-blog-post.js

      - name: 📤 Commit y push
        run: |
          git add blog/blog-data.json blog/*.html sitemap.xml
          git diff --staged --quiet || (
            git commit -m "📝 Blog: nuevo artículo $(date +'%d/%m/%Y')" &&
            git push
          )